[package]
name = "doorward-sqlite"
version = "0.1.1"
edition = "2024"
rust-version = "1.89"
description = "SQLite storage for doorward (sign-in for Rust web apps)"
authors = ["Ulrich Holtzhausen <98807810+ulrich-za@users.noreply.github.com>"]
license = "Apache-2.0"
repository = "https://github.com/ulrich-za/doorward"
readme = "README.md"
keywords = ["authentication", "sqlite", "doorward", "passkeys"]
categories = ["authentication", "database"]

[features]
default = ["bundled"]
# Build SQLite into the program (nothing to install).
bundled = ["rusqlite/bundled"]

[dependencies]
doorward = { version = "0.1.1", path = "..", default-features = false }
async-trait = "0.1.89"
# From 0.41: earlier versions bundle an SQLite with a known flaw
# (RUSTSEC-2026-0459).
rusqlite = { version = "0.41" }
tokio = { version = "1.48", default-features = false, features = ["rt"] }
uuid = { version = "1.18", default-features = false, features = ["std"] }

[dev-dependencies]
doorward = { version = "0.1.1", path = "..", features = ["test-util"] }
tokio = { version = "1.48", features = ["macros", "rt-multi-thread"] }
rusqlite = { version = "0.41" }
http = "1.3"

[lints.rust]
unsafe_code = "forbid"
